name: sanvidhi_site
description: Sanvidhi Site - site reporting for tower / EPC execution on ERPNext (daily site report, material receipt), works offline.
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  geolocator: ^13.0.2
  image_picker: ^1.1.2
  path_provider: ^2.1.4
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon_legacy.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 24
